name: fastbuild ubi2-oc with networking apps
on: workflow_dispatch
permissions:
  contents: write
  packages: write
  actions: write
jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04-arm
    strategy: {fail-fast: false, matrix: {target: [ubi2-oc]}}
    env:
      DK_OPENWRT: /bld/openwrt
      DK_BIN: /bld/openwrt_bin
      DK_USER: /bld/user
      DK_PROFILE: /bld/user/current
      GH_TOKEN: ${{ github.token }}
      # GHCR repository names must be lowercase; the account name contains capitals.
      IMG_INC: ghcr.io/transwarpcom/${{ github.event.repository.name }}:${{ matrix.target }}-inc
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with: {registry: ghcr.io, username: '${{ github.actor }}', password: '${{ github.token }}'}

    - id: gh
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with: {path: "ghcache\nstcache", key: 'cache-${{ matrix.target }}.${{ github.run_id }}', restore-keys: 'cache-${{ matrix.target }}.'}
    - id: dl
      uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
      with: {path: dlcache, key: 'dlcache.${{ github.run_id }}', restore-keys: dlcache.}

    - name: Seed caches if missing
      run: |
        mkdir -p openwrt_bin ghcache stcache dlcache
        if [ -z "$(ls -A ghcache 2>&-)" ] || [ -z "$(ls -A stcache 2>&-)" ]; then
          I=ghcr.io/transwarpcom/${{ github.event.repository.name }}:base-bldcache-${{ matrix.target }}
          if ! docker pull "$I"; then
            I=ghcr.io/w1700k/fastbuild_base:base-bldcache-${{ matrix.target }}
            docker pull "$I" || I=
          fi
          if [ -n "$I" ]; then docker create --name CA "$I" >/dev/null; for d in ghcache stcache dlcache; do docker cp CA:/$d/. "$d"; done; fi
        fi

    - name: Initialize environment
      run: |
        bash .github/scripts/fetch-distfeeds.sh user/default/files
        [ -f "user/${{ matrix.target }}/config.diff" ] || { echo "::error::config.diff not found for ${{ matrix.target }}"; exit 1; }
        rsync -aI --mkpath user/default/ user/${{ matrix.target }}/ user/current/ 2>&-
        echo 'CONFIG_CCACHE_DIR="/ghcache"' >> user/current/config.diff
        sudo tee /etc/docker/daemon.json <<< '{"max-concurrent-downloads":50,"max-concurrent-uploads":50,"experimental":true}'
        sudo systemctl reload docker
        IMAGE=$IMG_INC
        docker pull "$IMAGE" || {
          IMAGE=ghcr.io/transwarpcom/${{ github.event.repository.name }}:base-builder-${{ matrix.target }}
          docker pull "$IMAGE" || { IMAGE=ghcr.io/w1700k/fastbuild_base:base-builder; docker pull "$IMAGE"; }
        }
        docker run -dt --name DK -v $PWD/user:$DK_USER -v $PWD/openwrt_bin:$DK_BIN -v $PWD/ghcache:/ghcache -v $PWD/stcache:/stcache -v $PWD/dlcache:/dlcache $IMAGE
        install -m 755 /dev/stdin /usr/local/bin/docker_exec <<'DKR'
        #!/bin/bash
        for n in DK_BIN DK_USER DK_PROFILE DK_OPENWRT; do e+=(-e "$n=${!n}"); done
        exec docker exec -u 0 -i "${e[@]}" "$@"
        DKR

    - name: Prepare OpenWrt source
      run: |
        docker_exec DK bash -e -c '
          . $DK_USER/default/settings.ini &>/dev/null ||:
          . $DK_PROFILE/settings.ini
          [[ $REPO_URL && $REPO_BRANCH && $REPO_COMMIT ]] || { echo "::error::Missing REPO_URL, REPO_BRANCH, or REPO_COMMIT"; exit 1; }
          mkdir -p $DK_OPENWRT/files
          cd $DK_OPENWRT
          if [ ! -d .git ]; then git init; fi
          git remote set-url origin $REPO_URL 2>&- || git remote add origin $REPO_URL
          git fetch origin "$REPO_BRANCH"
          git checkout --force --detach "$REPO_COMMIT"
          [[ "$(git rev-parse HEAD)" == "$REPO_COMMIT" ]] || { echo "::error::Source commit mismatch"; exit 1; }
          git clean -fdx -- files
          mkdir -p files
          mountpoint $DK_BIN || { echo "::error::not mounted" >&2; exit 1; }
          ln -sf $DK_BIN bin && ln -sf /dlcache dl && ln -sf /stcache staging_dir
          bp=$DK_PROFILE fc=feeds.conf
          cp $bp/files/$fc $fc 2>&- && cp $fc /tmp/feeds.bak
          rm -rf feeds/* &>/dev/null
          ./scripts/feeds update -a &>/dev/null
          ./scripts/feeds install -a
          mv /tmp/feeds.bak $fc
          cp $bp/config.diff .config
          if [ -d "$bp/patches" ]; then
            shopt -s nullglob
            for p in "$bp"/patches/*.patch; do
              echo "Applying $p"
              patch --batch --forward -d . -p1 < "$p"
            done
          fi
          if [ -d "$bp/files" ]; then cp -r "$bp"/files/ .; fi
          if [ -f "$bp/files/feeds.conf" ]; then rm -f files/feeds.conf; fi
          if [ -f "$bp/custom.sh" ]; then bash -e "$bp/custom.sh"; fi
          {
            echo "Build profile: ${{ matrix.target }}"
            echo "Builds repository commit: ${{ github.sha }}"
            echo "OpenWrt repository: $REPO_URL"
            echo "OpenWrt branch: $REPO_BRANCH"
            echo "OpenWrt commit: $(git rev-parse HEAD)"
            echo "Config diff SHA256: $(sha256sum "$bp/config.diff" | cut -d " " -f1)"
            echo "Feeds config SHA256: $(sha256sum "$bp/files/$fc" | cut -d " " -f1)"
            echo "Profile input file SHA256 values:"
            find "$bp" -type f -print0 | sort -z | xargs -0 -r sha256sum
            echo "Resolved feed commits:"
            for feed in feeds/*; do
              if [ -d "$feed/.git" ]; then printf "  %s %s\n" "${feed#feeds/}" "$(git -C "$feed" rev-parse HEAD)"; fi
            done
          } > files/build_info
          cp files/build_info "$DK_BIN/build_info"
          make defconfig; echo "CONFIG_VERSION_NUMBER=${{ matrix.target }}" >> .config
          set -o pipefail
          make download -j8 2>&1 | tee /tmp/openwrt-download.log
          if grep -q "ERROR:" /tmp/openwrt-download.log; then echo "::error::Download log contains errors"; exit 1; fi
        '

    - name: Compile OpenWrt
      run: |
        touch openwrt_bin/.build-start
        build_ok=0
        for mode in c s; do
          if docker_exec -e MODE="$mode" DK bash -e -c '
            if [ -f "$DK_PROFILE/pre_compile.sh" ]; then bash -e "$DK_PROFILE/pre_compile.sh"; fi
            cd "$DK_OPENWRT"
            export FORCE_UNSAFE_CONFIGURE=1 CCACHE_SLOPPINESS=file_stat_matches,include_file_mtime,time_macros CCACHE_NOHASHDIR=true CCACHE_COMPILERCHECK=content
            make -j$(($(nproc) + 1)) V=$MODE
            if [ -x staging_dir/host/bin/ccache ]; then staging_dir/host/bin/ccache -d /ghcache -sz ||:; fi
          '; then build_ok=1; break; fi
        done
        [ "$build_ok" -eq 1 ] || { echo "::error::OpenWrt compilation failed"; exit 1; }

    - name: Create release
      run: bash .github/scripts/publish-firmware.sh "${{ matrix.target }}"

    - name: Upload builder container
      run: |
        docker_exec DK bash -c 'cd $DK_OPENWRT && rm -rf bin build_dir feeds tmp'
        docker commit -a openwrt-fastbuild -m "Building at $(date)" DK $IMG_INC
        docker push $IMG_INC

    - name: Delete old caches
      if: always()
      run: |
        for p in dlcache. cache-${{ matrix.target }}.; do
          gh cache list --json key,id --jq '.[] | select(.key | startswith("'"$p"'")) | .id' | xargs -r gh cache delete
        done ||:

    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: always()
      with: {path: "ghcache\nstcache", key: '${{ steps.gh.outputs.cache-primary-key }}'}
    - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
      if: always()
      with: {path: dlcache, key: '${{ steps.dl.outputs.cache-primary-key }}'}
